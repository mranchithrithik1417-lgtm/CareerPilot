<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareerPilot — AI Career Intelligence for Students</title>
  <meta name="description" content="AI-powered career readiness analysis for students. Know your skill gaps, find your best career path, and get a personalized roadmap.">

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><text y='22' x='6' font-size='18' font-family='sans-serif'>✦</text></svg>">

  <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>

<div id="app">

  <!-- ============================================================
       TOP BAR (visible on all pages except landing)
       ============================================================ -->
  <header class="topbar" id="topbar">
    <div class="topbar-brand">
      <div class="logo-icon">✦</div>
      CareerPilot
    </div>
    <div id="mode-indicator" style="font-size:0.78rem;padding:4px 12px;border-radius:999px;background:rgba(34,197,94,0.12);color:#22c55e;border:1px solid rgba(34,197,94,0.3);font-weight:600">
      🎓 Demo Mode
    </div>
    <nav class="topbar-nav" id="topbar-nav">
      <!-- Shown when analysis is complete -->
    </nav>
  </header>

  <!-- ============================================================
       PAGE: LANDING
       ============================================================ -->
  <div class="page" id="page-landing">
    <!-- Rendered by views.js → renderLanding() -->
  </div>

  <!-- ============================================================
       PAGE: LOADING / ANALYSIS
       ============================================================ -->
  <div class="page" id="page-loading">
    <!-- Rendered by controller.js → showLoadingPage() -->
  </div>

  <!-- ============================================================
       PAGE: DASHBOARD SHELL (sidebar + main content)
       The actual view content is swapped inside #page-dashboard
       ============================================================ -->
  <div class="page" id="page-dashboard-shell">
    <div class="dashboard">

      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-section-label">Analysis</div>

        <div class="sidebar-item" data-view="profile" onclick="App.navigate('profile')">
          <span class="icon">👤</span> Profile
        </div>
        <div class="sidebar-item" data-view="careers" onclick="App.navigate('careers')">
          <span class="icon">🎯</span> Career Matches
        </div>
        <div class="sidebar-item" data-view="gaps" onclick="App.navigate('gaps')">
          <span class="icon">📊</span> Skill Gaps
        </div>

        <div class="sidebar-section-label" style="margin-top:8px">Growth</div>

        <div class="sidebar-item" data-view="roadmap" onclick="App.navigate('roadmap')">
          <span class="icon">🗺️</span> Roadmap
        </div>
        <div class="sidebar-item" data-view="learning" onclick="App.navigate('learning')">
          <span class="icon">📚</span> Learning
        </div>

        <div class="sidebar-section-label" style="margin-top:8px">Readiness</div>

        <div class="sidebar-item" data-view="interview" onclick="App.navigate('interview')">
          <span class="icon">🎤</span> Mock Interview
        </div>
        <div class="sidebar-item" data-view="report" onclick="App.navigate('report')">
          <span class="icon">📋</span> Final Report
        </div>

        <div style="margin-top:auto;padding:1.25rem 1.25rem 0">
          <button class="btn btn-ghost" style="width:100%;font-size:0.82rem" onclick="App.navigate('landing')">
            ← Edit Profile
          </button>
        </div>
      </nav>

      <!-- Main content area — views render here -->
      <main class="main-content" id="page-dashboard">
        <!-- Content swapped by navigate() -->
      </main>

    </div>
  </div>

</div><!-- #app -->

<!-- ============================================================
     Scripts — order matters: app → ai → views → controller
     ============================================================ -->
<script src="src/js/app.js"></script>
<script src="src/js/ai.js"></script>
<script src="src/js/ai-local.js"></script>
<script src="src/js/views.js"></script>
<script src="src/js/controller.js"></script>

</body>
</html>
